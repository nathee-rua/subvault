name: Playwright End-to-End Acceptance Tests

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Playwright E2E Browser Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-temp/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          cd app-temp && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Environment Safety Guard
        run: npm run e2e:guard
        env:
          E2E_TEST_MODE: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
          E2E_TEST_ENVIRONMENT: 'local'
          E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'

      - name: Run Playwright E2E Tests
        run: npm run e2e
        env:
          E2E_TEST_MODE: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
          E2E_TEST_ENVIRONMENT: 'local'
          E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'

      - name: Generate E2E Summary Report
        if: always()
        run: node scripts/generate-e2e-report.mjs

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            tests/e2e/reports/
            playwright-report/
            test-results/
          retention-days: 7
