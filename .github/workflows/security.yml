name: Security & Secret Leak Prevention Guardrails

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  boundary-checks:
    name: Environment & Security Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-temp/package-lock.json

      - name: Install Dependencies
        run: cd app-temp && npm ci

      - name: Run Security Boundary Checks
        run: cd app-temp && npm run security:boundaries

      - name: Run Unit Tests
        run: cd app-temp && npm run test

      - name: Run Next.js Typecheck & Production Build
        run: cd app-temp && npm run build
